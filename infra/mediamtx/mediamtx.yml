# MediaMTX: the single connection point for every camera.
# Phones (Larix Broadcaster) and fake cameras (scripts/fake-cameras.ps1) PUBLISH here;
# the vision worker and the browser READ from here.
#
#   Publish:  rtsp://<laptop-ip>:8554/cam1   (user: publisher / pass: see below)
#   Read:     rtsp://localhost:8554/cam1
#   Browser:  http://localhost:8889/cam1     (WebRTC player)

logLevel: info

# Default is 10s; phones on Wi-Fi and busy laptops can stall longer than that and get kicked.
readTimeout: 30s
writeTimeout: 30s

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Lets the browser on this laptop reach WebRTC when MediaMTX runs inside Docker.
webrtcAdditionalHosts: [127.0.0.1, localhost]

hls: yes
hlsAddress: :8888

rtmp: no
srt: no
moq: no
# Control API and playback server: used only by our API on this machine (compose binds both
# ports to 127.0.0.1) with the "aivision" user below.
api: yes
apiAddress: :9997
playback: yes
playbackAddress: :9996

# Recording: off by default; our API switches it on per camera (Settings > Recording) and sets
# how long to keep it. fMP4 segments, no re-encoding. The API also enforces a total size cap.
pathDefaults:
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 10m
  recordDeleteAfter: 7d

# Anyone on the LAN can READ live video; only someone with the password can PUBLISH.
# Real passwords live in .env: compose.yaml passes MEDIAMTX_PUBLISH_PASSWORD as
# MTX_AUTHINTERNALUSERS_1_PASS and MEDIAMTX_API_PASSWORD as MTX_AUTHINTERNALUSERS_2_PASS,
# replacing the placeholders below (so they never sit in git).
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: read
  - user: publisher
    pass: set-MEDIAMTX_PUBLISH_PASSWORD-in-.env
    ips: []
    permissions:
      - action: publish
  - user: aivision
    pass: set-MEDIAMTX_API_PASSWORD-in-.env
    ips: []
    permissions:
      - action: api
      - action: playback
      - action: read

paths:
  # IP cameras are added here automatically by our API (as aiv<camera id>, pulling the camera once
  # and sharing it with the worker, the dashboard and the recorder). Nothing to edit by hand.

  # cam1..cam4 (and anything else) accept a publisher (phone or fake camera).
  all_others:
